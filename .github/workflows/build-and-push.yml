name: Build and Push Docker Image to GHCR

# 触发条件：当你推送到 main 分支，或者创建了以 v 开头的标签（如 v1.0）时触发
on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  # 允许在 GitHub 网页上手动点击触发
  workflow_dispatch:

env:
  # GHCR 的仓库地址（固定不变）
  REGISTRY: ghcr.io
  # 镜像名称，默认使用 "你的用户名/你的项目名"（全部转为小写）
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # 授予该任务写入 GitHub Packages 的权限
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 拉取代码到打包机
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 登录到 GHCR
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 自动提取元数据（用于生成镜像的标签，如 :main 或 :v1.0）
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 4. 设置 Docker Buildx（支持缓存和高级构建特性）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 修复这里：移除了错误的 std 前缀，直接使用 metadata 输出的 tags
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 开启缓存，大幅提升后续构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max